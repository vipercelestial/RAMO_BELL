<!doctype html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPro Image Gallery</title>
    <style>
      #bg-image {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          object-fit: cover;
          filter: blur(10px) brightness(.5);
          transform: scale(1.05) rotate(-1deg);
          animation: background-fade-in 4.5s ease forwards;
          z-index: -1;
      }
      * {
        box-sizing: border-box;
      }

      body { 
          font-family: Arial, sans-serif; 
          margin: 0px; 
          background: #11052C; 
          color: #ffffff; 
      } 
      header {
        color: white;
        text-align: center;
        padding: 10px;
        width: 100%;
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .gallery {
        place-self: center;
        column-count: 6;   
        column-gap: 0px;     
        max-width: 1500px;
        margin: 20px;
        column-gap: 10px;
        padding: 20px;
      }

  
      .gallery-item {
        position: relative;
        width: 100%;
        border: 2px solid transparent;
        margin-bottom: 10px;
        overflow: hidden;
        border-radius: 5px;
        isolation: isolate;
        break-inside: avoid;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .gallery-image {
        display: block;
        width: 100%;
        height: auto;
      }

      .gallery-item::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          0deg,
          transparent,
          transparent 30%,
          rgba(144, 12, 189, 0.3)
        );
        transform: rotate(-45deg);
        transition: all 0.5s ease;
        opacity: 0;
        pointer-events: none;
      }

      .gallery-item:hover {
        z-index: 1;
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(165, 58, 223, 0.5);
        border: 2px solid rgba(165, 58, 223, 0.5);
      }

      .gallery-item:hover::before {
        opacity: 1;
        transform: rotate(-45deg) translateY(100%);
      }

      footer {
        color: white;
        text-align: center;
        padding: 14px;
        background: transparent;
        position: sticky;
        bottom: 0;
        width: 100%;
        z-index: 10;
        backdrop-filter: blur(10px);

      }

      @media (max-width: 1500px) {
        .gallery {
          column-count: 5;
        }
      }

   
      @media (max-width: 1200px) {
        .gallery {
          column-count: 4;
        }
      }

      @media (max-width: 900px) {
        .gallery {
          column-count: 3;
        }
      }

      @media (max-width: 600px) {
        .gallery {
          column-count: 2;
        }
      }

    </style>
  </head>
