<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPro Image Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      header {
        background: #7b1530;
        color: white;
        text-align: center;
        padding: 24px;
      }

      .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        max-width: 1100px;
        margin: auto;
        padding: 20px;
      }

      .gallery-item {
        flex: 1 1 220px;
        max-width: 320px;
        background: white;
        border: 2px solid #7b1530;
        border-radius: 8px;
        overflow: hidden;
      }

      .gallery-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }

      .caption {
        padding: 12px;
        text-align: center;
      }

      footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 14px;
      }

      @media (max-width: 600px) {
        .gallery {
          flex-direction: column;
          align-items: center;
        }

        .gallery-item {
          width: 100%;
          max-width: 420px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>TechPro Image Gallery</h1>
      <p>Responsive Image Gallery using Flexbox</p>
    </header>

    <main>
		<section class="gallery">
			<article class="gallery-item">
				<img src="images/1.jpg" alt="Computer laboratory">
			</article>

			<article class="gallery-item">
				<img src="images/2.png" alt="Programming activity">
			</article>

			<article class="gallery-item">
				<img src="images/3.jpg" alt="Robotics project">
			</article>

			<article class="gallery-item">
				<img src="images/4.jpg" alt="Networking lesson">
			</article>

			<article class="gallery-item">
				<img src="images/5.jpg" alt="Web design activity">
			</article>

			<article class="gallery-item">
				<img src="images/6.jpg" alt="ICT student projects">
			</article>

			<article class="gallery-item">
				<img src="images/7.jpg" alt="ICT student projects">
			</article>

			<article class="gallery-item">
				<img src="images/8.jpg" alt="ICT student projects">
			</article>
		</section>

    </main>
    <footer>Grade 11 TechPro | Responsive Image Gallery</footer>
  </body>
</html>
