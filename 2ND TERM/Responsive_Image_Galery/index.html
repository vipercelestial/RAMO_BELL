<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPro Image Gallery</title>
    <style>
      #bg-image {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          object-fit: cover;
          filter: blur(10px) brightness(.5);
          transform: scale(1.05) rotate(-1deg);
          animation: background-fade-in 4.5s ease forwards;
          z-index: -1;
      }
      * {
        box-sizing: border-box;
      }

      body { 
          font-family: Arial, sans-serif; 
          margin: 24px; 
          background: #11052C; 
          color: #ffffff; 
      } 
      header {
        background: transparent;
        color: white;
        text-align: center;
        padding: 24px;
        backdrop-filter: blur(10px);
      }

      .gallery {
        place-self: center;
        column-count: 5;   
        column-gap: 0px;     
        max-width: 1500px;
        margin: 20px;
        column-gap: 10px;
        padding: 20px;
      }

  
      .gallery-item {
        width: 100%;        
        height: auto;          
        display: block;
        border: none;
        overflow: hidden;
        object-fit: cover;
        transition: transform 0.2s ease-in-out;
        margin-bottom: 10px;
      }

      .gallery-item:hover {
        transform: scale(1.05);  
      }

      footer {
        color: white;
        text-align: center;
        padding: 14px;
        background: transparent;
        backdrop-filter: blur(10px);

      }

   
      @media (max-width: 1350px) {
        .gallery {
          column-count: 4;
        }
      }

      @media (max-width: 900px) {
        .gallery {
          column-count: 3;
        }
      }

      @media (max-width: 600px) {
        .gallery {
          column-count: 2;
        }
      }

    </style>
  </head>
  <body>
    <img id="bg-image" src="images/bg4.jpg" alt="Background Image">
    <header>
      <h1>TechPro Image Gallery</h1>
      <p>Responsive Image Gallery using Flexbox</p>
    </header>

    <main>
      <section class="gallery">
        <img src="images/1.jpg" alt="picture" class="gallery-item">
        <img src="images/2.png" alt="picture" class="gallery-item"> 
        <img src="images/3.jpg" alt="picture" class="gallery-item">
        <img src="images/4.jpg" alt="picture" class="gallery-item">
        <img src="images/5.jpg" alt="picture" class="gallery-item">
        <img src="images/6.jpg" alt="picture" class="gallery-item">
        <img src="images/7.jpg" alt="picture" class="gallery-item">
        <img src="images/8.jpg" alt="picture" class="gallery-item">
        <img src="images/9.jpg" alt="picture" class="gallery-item">
        <img src="images/10.jpg" alt="picture" class="gallery-item">
        <img src="images/11.jpg" alt="picture" class="gallery-item">
        <img src="images/12.jpg" alt="picture" class="gallery-item">
        <img src="images/13.jpg" alt="picture" class="gallery-item">
        <img src="images/14.jpg" alt="picture" class="gallery-item">
        <img src="images/15.jpg" alt="picture" class="gallery-item">
        <img src="images/16.jpg" alt="picture" class="gallery-item">
        <img src="images/17.jpg" alt="picture" class="gallery-item">
        <img src="images/18.jpg" alt="picture" class="gallery-item">
        <img src="images/19.jpg" alt="picture" class="gallery-item">
        <img src="images/20.jpg" alt="picture" class="gallery-item">
        <img src="images/21.jpg" alt="picture" class="gallery-item">
        <img src="images/22.jpg" alt="picture" class="gallery-item">
        <img src="images/23.jpg" alt="picture" class="gallery-item">
        <img src="images/24.jpg" alt="picture" class="gallery-item">
        <img src="images/25.jpg" alt="picture" class="gallery-item">
        <img src="images/26.jpg" alt="picture" class="gallery-item">
      </section>
    </main>
    <footer>Grade 11 TechPro | Responsive Image Gallery</footer>
  </body>
</html>
