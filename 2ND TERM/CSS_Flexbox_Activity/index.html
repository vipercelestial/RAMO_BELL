<!DOCTYPE html> 
<html lang="en"> 
    <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>TechPro Flexbox Page</title> 
    <style> 
        * {
            box-sizing: border-box;
        } 

        body {
            margin: 0; 
            font-family: Arial, sans-serif; 
            line-height: 1.5;
        } 
        header {
            background: #7b1530; 
            color: white; 
            padding: 20px; 
            text-align: center;
        } 
        nav {
            display: flex; 
            justify-content: space-between; 
            align-items: center; gap: 12px; 
            background: #f3e5e9; 
            padding: 12px 20px;
        } 
        nav a {
            color: #7b1530; 
            text-decoration: none; 
            font-weight: bold;
        } 
        main { 
            max-width: 1000px; 
            margin: auto; 
            padding: 20px; 
        }

        .flex-container {
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: space-evenly; 
            align-items: stretch; 
            gap: 15px; 
            background: #eee; 
            padding: 15px; 
            min-height: 180px; 
        } 
        .card { flex: 1 1 220px; 
            background: white; 
            border: 2px solid #7b1530; 
            padding: 18px; 
            text-align: center; 
        } 

        .featured {
            order: 2; 
            flex-grow: 2;
        } 
        .special {
            align-self: center;
        } 
        footer {
            position:fixed;
            background: #222; 
            color: white; 
            padding: 15px; 
            text-align: center;
        } 


        @media (max-width: 600px) { 
        nav { flex-direction: column; 
            align-items: stretch;
        } 
        .flex-container {
            flex-direction: column;
        } 
        .card {
            flex: 1 1 auto;
        } 
        } 
    </style> 
</head> 
<body> 
<header><h1>TechPro Learning Hub</h1><p>Learning CSS Flexbox</p></header> 
<nav><a href="#">Home</a><a href="#">Lessons</a><a href="#">Activities</a><a 
href="#">Contact</a></nav> 
<main> 
<h2>Our Learning Cards</h2> 
<p>Resize the browser window to test the responsive layout.</p> 
<section class="flex-container"> 
<article class="card">HTML Basics</article> 
<article class="card featured">CSS Styling</article> 
<article class="card special">JavaScript</article> 
</section> 
</main> 
<footer>Grade 11 TechPro | CSS Flexbox Activity</footer> 
</body> 
</html>
