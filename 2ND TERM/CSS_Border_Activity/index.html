<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Border Activity</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: white;
            background-image: url('images/backgrond.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        h1 {
            border-top: 5px solid red;
            border-right: 5px dashed blue;
            border-bottom: 8px double green;
            border-left: 3px dotted purple;

            border-radius: 15px ;
        }


    </style>

</head>

<body>

    <div class="main">

    <h1>CSS Border Activity</h1>
    <p>Learning CSS borders using Visual Studio Code.</p>    
   
    </div>
</body>
</html>
