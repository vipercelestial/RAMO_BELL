<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=e, initial-scale=1.0">
    <title>Padding</title>

  <style>
    #bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: blur(0px) brightness(1);
        transform: scale(1.05) rotate(0deg);
        z-index: -1;
    }
    /* pasikat na animation para sa bg image haha */
    @keyframes background-fade-in {
        to {
            filter: blur(5px) brightness(0.5);
        }
    }

    body {
        font-family: Arial, sans-serif;
    }

    h1 {
        background: rgba(26, 9, 51, 0.45);
        color: #ffffff;
        text-align: center;
        font-family: Impact, sans-serif;
        letter-spacing: 1.5px;
        padding: 18px 40px;
        width: fit-content;
        margin: 10px auto;
        margin-top: 30px;
        border-radius: 30px;
        border-top: 2px solid rgba(255, 255, 255, 0.3);
        border-left: 2px solid rgba(255, 255, 255, 0.3);
        text-shadow: 0 0 10px #CE99FF, 0 0 20px #593d83;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(12px);
    }

    .firstparagraph {
        width: 300px;
        margin: 30px auto;
        padding: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3); 
        box-sizing: border-box;
        place-self: center;
        border-radius: 30px;
        color: #ffffff;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-style: none;
    }

    .profilecard {
        place-self: center;
        border: 2px solid rgba(255, 255, 255, 0.3); 
        max-width: 350px;
        margin: 30px; 
        box-sizing: border-box;
        padding: 20px;
        border-radius: 30px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-style: none;
    }
    legend {
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: rgba(26, 9, 51, 0.45);
        margin: 10px; 
        box-sizing: border-box;
        padding: 10px;
        border-radius: 20px;
        text-align: center;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }
    fieldset {
        border: 2px solid rgba(255, 255, 255, 0.3); 
        background: rgba(26, 9, 51, 0.45);
        margin: 10px; 
        box-sizing: border-box;
        padding: 10px;
        border-radius: 20px;
        color: #ffffff;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
    <img src="images/bg4.jpg" alt="Background Image" id="bg-image">
  <div class="main">

    <h1>My CSS Padding Activity</h1>
    <p class="firstparagraph">This paragraph has 20 pixels of padding.</p>

    <div class="profilecard">
        <fieldset>
            <legend  z>My TechPro Profile</legend>
            <ul>
                <li>Ramo, Jeric Y.</li>
                <li>11-Bell</li>
            </ul>
        </fieldset>

        <fieldset>
            <legend>What im learning in ICT?</legend>
            <p>-I am currently learning CSS and is trying to master it for future use.</p>
        </fieldset>
    </div>

  </div>

</body>
</html>
