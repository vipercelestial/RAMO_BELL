<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=e, initial-scale=1.0">
    <title>Padding</title>

  <style>
    body {
        font-family: Arial, sans-serif;
    }

    .box {
        width: 300px;
        padding: 25px;
        border: 3px solid maroon;
        box-sizing: border-box;
    }

    .profilecard {
        width: 350px;
        padding: 20px;
        border: 3px solid maroon;
        box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="main">

    <h1>My CSS Padding Activity</h1>
    <p class="box">This paragraph has 20 pixels of padding.</p>

    <div class="profilecard">
        <fieldset>
            <legend align="center">My TechPro Profile</legend>
            <ul>
                <li>Ramo, Jeric Y.</li>
                <li>11-Bell</li>
            </ul>
        </fieldset>

        <fieldset>
            <legend>What im learning in ICT?</legend>
            <p>-I am currently learning about CSS and is trying to master it for future use.</p>
        </fieldset>
    </div>

  </div>

</body>
</html>
