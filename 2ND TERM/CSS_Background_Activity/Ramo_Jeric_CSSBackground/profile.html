<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE</title>
    <link rel="stylesheet" href="style.css">

    <style>

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;

            filter: blur(1px) brightness(0.5);
            transform: scale(1.05);
            z-index: -1;
        }

        .profile-container {
            display: flex;
            align-items: center; 
            gap: 30px; 
            text-align: left;

            background-color: rgba(99, 24, 124, 0.5);
            backdrop-filter: blur(10px);

            margin-top: 100px;
            margin: 50px;        
            padding: 20px;    

            border-radius: 10px;
        }

        .profile-right {
            display: flex;
            flex-direction: column; 
            gap: 12px; 
            width: 100%;
        }

        .profile-right p {
            margin: 0;
            padding: 12px 15px;
            border-radius: 10px;
            background-color: rgba(73, 22, 98, 0.5);
            color: white;
        }
        
        .profile-right legend {
            font-weight: bold;
            color: white;
            
            border: 1px solid rgb(208, 16, 16);
        }

        fieldset {
            border-radius: 10px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);

            border-color: rgb(208, 16, 16);
        }
    </style>
</head>

<body>
        <img id="bg-image" src="images/background.jpg" alt="Background Image">

<div class="profile-container">

    <div class="profile-left">
        <fieldset>
            <legend>Profile Picture</legend>
            <img src="images/profile.png" alt="Profile Picture" width="160" height="180">
        </fieldset>
    </div>

    <div class="profile-right">

        <fieldset>
            <legend>Name:</legend>
            <p>Ramo, Jeric Y.</p>
        </fieldset>

        <fieldset>
            <legend>Grade/Section:</legend>
            <p>11-Bell</p>
        </fieldset>

        <fieldset>
            <legend>Favorite Technology:</legend>
            <p>Wireless Communication and AI</p>
        </fieldset>

        <fieldset>
            <legend>Favorite Programming Language:</legend>
            <p>Python</p>
        </fieldset>

        <fieldset>
            <legend>Dream Career:</legend>
            <p>IT Specialist</p>
        </fieldset>
    </div>
</div>

</body>
</html>
