<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>

    <style>
        p {
            border: 2px solid maroon;
            margin: 30px;
            padding: 10px;
        }
        .margin1 {
            margin-bottom: 40px;
        }
        .margin2 {
            margin-top: 20px;
        }

        .card { 
            border: 3px solid maroon; 
            margin: 30px; 
            padding: 20px; 
        } 
        .card h2 { 
            margin-bottom: 20px; 
        } 
        .card p { 
            margin-top: 10px; 
        } 
    </style>
</head>
<body>
    
    <h1>CSS Margin Activity</h1>
    <p class="margin1">This paragraph has a margin.</p>
    <p class="margin2">test test test test test test</p>

    <div class="card"> 
        <h2>My TechPro Profile</h2> 
        <p><b>Name:</b> Ramo, Jeric Y.</p> 
        <p><b>Grade: Grade</b> 11</p> 
        <p><b>Course: </b>TechPro</p> 
        <p><b>Favourite Technology:</b> Networking and Machine Learning</p> 
    </div>

</body>
</html>
