<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin</title>

    <style>
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            filter: blur(5px) brightness(0.75);
            transform: scale(1.05) rotate(0deg);
            z-index: -1;
        }
        /* pasikat na animation para sa bg image haha */
        /* @keyframes background-fade-in {
            to {
                filter: blur(5px) brightness(0.5);
            }
        } */

        body {
            margin-top: 20px;
        }

        h1 {
            background: rgba(26, 9, 51, 0.45);
            color: #ffffff;
            text-align: center;
            font-family: Impact, sans-serif;
            letter-spacing: 1.5px;
            padding: 18px 40px;
            width: fit-content;
            margin: 10px auto;
            border-radius: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 10px #CE99FF, 0 0 20px #593d83;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .context .margin1 {
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            padding: 10px;
            margin: 20px;

            margin-bottom: 40px;
        }
        .context .margin2 {
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            text-align: center;
            padding: 10px;
            margin: 20px;

            margin-top: 20px;
        }

        .card { 
            place-self: center;
            border: 3px solid rgba(255, 255, 255, 0.3); 
            max-width: 800px;
            margin: 30px; 
            padding: 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        } 
        .card h2 { 
            margin-bottom: 20px;

            color: #ffffff;
            font-family: Impact, sans-serif;
            text-shadow: 0 0 10px #CE99FF, 0 0 20px #593d83;
            background: rgba(26, 9, 51, 0.45);
            text-align: center;
            width: fit-content;
            padding: 12px 30px;
            margin: 10px auto;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .card p { 
            margin-top: 10px; 
            border-radius: 25px;

            margin: 30px;
            padding: 15px;

            background: transparent;
background: rgba(26, 9, 51, 0.25);
            color: #ffffff;
            text-align: center;
            font-family: Impact, sans-serif;
            letter-spacing: 1.5px;
            width: fit-content;
            border-radius: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 10px #CE99FF, 0 0 20px #593d83;
        }
    </style>
</head>
<body>

    <img src="images/bg5.jpg" alt="Background Image" id="bg-image">

    <div class="context">
        <h1>CSS Margin Activity</h1>
        <div class="margin1">This paragraph has a margin.</div>
        <div class="margin2">This paragraph also has a margin.</div>
    </div>

    <div class="card"> 
        <h2><b>TechPro Profile</b></h2> 
        <p><b>Name:</b> Ramo, Jeric Y.</p> 
        <p><b>Grade:</b> Grade 11</p> 
        <p><b>Course: </b>TechPro</p> 
        <p><b>Favourite Technology:</b> Networking and Machine Learning</p> 
    </div>

</body>
</html>
